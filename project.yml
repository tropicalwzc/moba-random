name: MobaRandom
options:
  bundleIdPrefix: com.tropicalfish
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
schemes:
  MobaRandom:
    build:
      targets:
        MobaRandom: all
        MobaRandomTests: [test]
        MobaRandomUITests: [test]
    test:
      targets:
        - MobaRandomTests
        - MobaRandomUITests
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Pinned so `xcodegen generate` keeps the signing team instead of clearing it.
    DEVELOPMENT_TEAM: "39R699SCD9"
    CODE_SIGN_STYLE: Automatic
targets:
  MobaRandom:
    type: application
    platform: iOS
    sources:
      - path: MobaRandom
        excludes:
          - Config/Info.plist
          - Resources/BO3
      - path: MobaRandom/Resources/BO3
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tropicalfish.mobarandom
        PRODUCT_NAME: MobaRandom
        PRODUCT_MODULE_NAME: MobaRandom
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MobaRandom/Config/Info.plist
  MobaRandomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MobaRandomTests
    dependencies:
      - target: MobaRandom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tropicalfish.mobarandomTests
        GENERATE_INFOPLIST_FILE: true
  MobaRandomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MobaRandomUITests
    dependencies:
      - target: MobaRandom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tropicalfish.mobarandomUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: MobaRandom
